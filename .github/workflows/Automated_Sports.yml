name: Automated Sports Data JSON & All TXT Updater

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [update-playlist]

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "ireentv"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz urllib3 pillow

      - name: Fetch, Generate VS Banners and Update All Files
        env:
          JSON_PLAYLIST_URLS: ${{ secrets.JSON_PLAYLIST_URLS }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          git pull origin main --rebase

          cat << 'EOF' > update_playlist.py
          import os
          import re
          import json
          import hashlib
          import requests
          import urllib3
          from io import BytesIO
          from datetime import datetime
          import pytz
          from PIL import Image, ImageDraw, ImageFont

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          tz = pytz.timezone("Asia/Kolkata")
          current_time = datetime.now(tz).strftime("%I:%M %p %d-%m-%Y")

          raw_urls = os.environ.get("JSON_PLAYLIST_URLS", "")
          repo_name = os.environ.get("GITHUB_REPO", "ireentv/repository")
          lines = [u.strip() for u in raw_urls.splitlines() if u.strip() and not u.strip().startswith("#")]

          LOGOS_DIR = "logos"
          os.makedirs(LOGOS_DIR, exist_ok=True)
          BASE_IMG_URL = f"https://raw.githubusercontent.com/{repo_name}/main/{LOGOS_DIR}"

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          }

          team_logo_cache = {}

          def fetch_data(url):
              res = requests.get(url, headers=HEADERS, timeout=30, verify=False)
              res.raise_for_status()
              clean_text = res.content.decode('utf-8-sig', errors='ignore').strip()
              return json.loads(clean_text)

          # ================= SPORTS LOGO SEARCH (TheSportsDB) =================
          def get_team_logo_online(team_name):
              clean_name = re.sub(r'[^a-zA-Z0-9 ]', '', team_name).strip()
              if not clean_name or len(clean_name) < 2:
                  return None
              
              if clean_name.lower() in team_logo_cache:
                  return team_logo_cache[clean_name.lower()]

              api_url = f"https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t={clean_name}"
              try:
                  r = requests.get(api_url, headers=HEADERS, timeout=5)
                  if r.status_code == 200:
                      data = r.json()
                      teams = data.get("teams")
                      if teams and isinstance(teams, list) and len(teams) > 0:
                          badge = teams[0].get("strBadge") or teams[0].get("strLogo")
                          if badge:
                              team_logo_cache[clean_name.lower()] = badge
                              return badge
              except Exception:
                  pass

              team_logo_cache[clean_name.lower()] = None
              return None

          def download_pil_image(img_url):
              if not img_url or not str(img_url).startswith("http"):
                  return None
              try:
                  r = requests.get(img_url, headers=HEADERS, timeout=6, verify=False)
                  if r.status_code == 200 and len(r.content) > 500:
                      return Image.open(BytesIO(r.content)).convert("RGBA")
              except Exception:
                  pass
              return None

          # ================= AUTOMATIC "VS" BANNER GENERATOR =================
          def generate_vs_banner(team1, team2, logo1_url=None, logo2_url=None, sub_text=""):
              safe_id = hashlib.md5(f"{team1}_vs_{team2}".lower().encode()).hexdigest()[:12]
              filename = f"vs_{safe_id}.png"
              local_path = os.path.join(LOGOS_DIR, filename)

              # ক্যাশে থাকলে পুনরায় তৈরি না করে সরাসরি লিংক দেবে
              if os.path.exists(local_path):
                  return f"{BASE_IMG_URL}/{filename}"

              # লোগো না থাকলে অনলাইন থেকে খোঁজা
              if not logo1_url:
                  logo1_url = get_team_logo_online(team1)
              if not logo2_url:
                  logo2_url = get_team_logo_online(team2)

              img1 = download_pil_image(logo1_url)
              img2 = download_pil_image(logo2_url)

              # ক্যানভাস তৈরি: 900x500 (16:9 ডার্ক প্রিমিয়াম ব্যাকগ্রাউন্ড)
              W, H = 900, 500
              banner = Image.new("RGBA", (W, H), (15, 23, 42, 255)) # Dark Navy
              draw = ImageDraw.Draw(banner)

              # ব্যাকগ্রাউন্ড ডিজাইন
              draw.rectangle([(0, 0), (W, 60)], fill=(30, 41, 59, 255))
              draw.line([(W // 2, 80), (W // 2, H - 40)], fill=(51, 65, 85, 180), width=2)

              # টিম ১ এর লোগো ড্র করা (বাম পাশে)
              if img1:
                  img1.thumbnail((200, 200), Image.Resampling.LANCZOS)
                  w1, h1 = img1.size
                  banner.paste(img1, (W // 4 - w1 // 2, 170 - h1 // 2), img1)
              else:
                  draw.ellipse([W // 4 - 60, 110, W // 4 + 60, 230], fill=(30, 41, 59, 255), outline=(100, 116, 139), width=2)

              # টিম ২ এর লোগো ড্র করা (ডান পাশে)
              if img2:
                  img2.thumbnail((200, 200), Image.Resampling.LANCZOS)
                  w2, h2 = img2.size
                  banner.paste(img2, (3 * W // 4 - w2 // 2, 170 - h2 // 2), img2)
              else:
                  draw.ellipse([3 * W // 4 - 60, 110, 3 * W // 4 + 60, 230], fill=(30, 41, 59, 255), outline=(100, 116, 139), width=2)

              # সেন্টারে সুন্দর "VS" ব্যাজ তৈরি
              cx, cy = W // 2, 170
              draw.ellipse([cx - 40, cy - 40, cx + 40, cy + 40], fill=(225, 29, 72, 255)) # Crimson Red circle
              draw.text((cx - 15, cy - 14), "VS", fill=(255, 255, 255, 255))

              # টেক্সট ড্র (দলের নাম ও টুর্নামেন্ট)
              def draw_centered_text(y, text, color=(255, 255, 255)):
                  text_clean = text[:20]
                  draw.text((W // 4 - (len(text_clean) * 4), y), text_clean, fill=color)

              draw_centered_text(310, team1.upper())
              draw.text((3 * W // 4 - (len(team2[:20]) * 4), 310), team2[:20].upper(), fill=(255, 255, 255))

              if sub_text:
                  draw.text((W // 2 - (len(sub_text[:35]) * 4), 22), sub_text[:35].upper(), fill=(148, 163, 184))

              # সেভ করা
              banner.save(local_path, format="PNG")
              return f"{BASE_IMG_URL}/{filename}"

          # ================= EXTRACT TEAMS =================
          def detect_teams_and_assign_logo(event):
              title = event.get("title", "")
              sub = event.get("sub_category") or event.get("sport") or ""
              
              # সোর্স অবজেক্টে সরাসরি কোনো দলের নাম আছে কিনা দেখা
              team1 = event.get("localteam_name") or event.get("team1")
              team2 = event.get("visitorteam_name") or event.get("team2")
              logo1 = event.get("localteam_logo") or event.get("team1_logo")
              logo2 = event.get("visitorteam_logo") or event.get("team2_logo")

              # যদি আলাদা ফিল্ড না থাকে, টাইটেল থেকে "Real Madrid vs Arsenal" আলাদা করা
              if not (team1 and team2):
                  parts = re.split(r'\s+(?:vs\.?|v|-)\s+', title, flags=re.IGNORECASE)
                  if len(parts) >= 2:
                      team1 = parts[0].strip()
                      team2 = parts[1].split("(")[0].split("|")[0].strip()

              # দুটি দল সনাক্ত হলে সুন্দর VS ব্যানার বানিয়ে দেবে
              if team1 and team2 and len(team1) > 1 and len(team2) > 1:
                  vs_logo_url = generate_vs_banner(team1, team2, logo1, logo2, sub)
                  event["logo"] = vs_logo_url
                  event["cover_image"] = vs_logo_url
                  return

              # দল শনাক্ত না হলে রেগুলার লোগো ক্যাশ করা
              orig_logo = event.get("logo") or event.get("cover_image")
              if orig_logo and str(orig_logo).startswith("http"):
                  safe_name = f"logo_{hashlib.md5(orig_logo.encode()).hexdigest()[:12]}.jpg"
                  local_f = os.path.join(LOGOS_DIR, safe_name)
                  if not os.path.exists(local_f):
                      try:
                          r = requests.get(orig_logo, headers=HEADERS, timeout=6, verify=False)
                          if r.status_code == 200:
                              with open(local_f, "wb") as f:
                                  f.write(r.content)
                      except Exception:
                          pass
                  if os.path.exists(local_f):
                      event["logo"] = f"{BASE_IMG_URL}/{safe_name}"
                      event["cover_image"] = f"{BASE_IMG_URL}/{safe_name}"

          # ================= PARSERS =================
          def is_livesports_item(item):
              if not isinstance(item, dict): return False
              return ("channels" in item and isinstance(item["channels"], list)) or ("schedule" in item)

          def transform_livesports_item(item):
              title = item.get("title") or "Sports Match"
              sport = item.get("sport") or "Cricket"
              sub_category = item.get("sub_category") or ""
              logo = item.get("logo") or item.get("cover_image") or ""
              match_id = str(item.get("slug") or item.get("match_id") or sport)
              schedule = item.get("schedule", {}) if isinstance(item.get("schedule"), dict) else {}
              start_time_bst = schedule.get("start_time_bst") or item.get("start_time_bst") or item.get("time") or ""

              status_raw = str(item.get("status", "")).strip().upper()
              status = "LIVE" if status_raw in ["LIVE", "PLAYING", "IN_PLAY"] or is_live_event(item) else (status_raw or "UPCOMING")

              stream_url_alpha = {}
              channels = item.get("channels", [])
              if isinstance(channels, list):
                  for ch in channels:
                      if not isinstance(ch, dict): continue
                      ch_name = ch.get("channel_name") or f"Server {len(stream_url_alpha) + 1}"
                      ch_url = ch.get("raw_link") or ch.get("url") or ""
                      headers = ch.get("headers")
                      if ch_url and isinstance(headers, dict) and "|" not in ch_url:
                          h_parts = [f"{k}={v}" for k, v in headers.items() if v]
                          if h_parts: ch_url += "|" + "&".join(h_parts)
                      drm = ch.get("drm_key")
                      if ch_url and drm:
                          ch_url += f"&drm_key={drm}" if "|" in ch_url else f"|drm_key={drm}"
                      if ch_url: stream_url_alpha[ch_name] = ch_url

              return {
                  "match_id": match_id,
                  "title": title,
                  "sport": sport,
                  "sub_category": sub_category,
                  "status": status,
                  "start_time_bst": start_time_bst,
                  "time": start_time_bst,
                  "logo": logo,
                  "cover_image": logo,
                  "is_free": False,
                  "stream_url_alpha": stream_url_alpha
              }

          def is_sonyliv_item(item):
              if not isinstance(item, dict): return False
              return any(k in item for k in ["multiple_audio_links", "video_info", "contentId"])

          def transform_sonyliv_item(item):
              v_info = item.get("video_info", {}) if isinstance(item.get("video_info"), dict) else {}
              img_cdn = item.get("image_cdn", {}) if isinstance(item.get("image_cdn"), dict) else {}
              air_dates = item.get("air_dates", {}) if isinstance(item.get("air_dates"), dict) else {}
              title = v_info.get("episodeTitle") or v_info.get("title") or item.get("title") or "Sports Match"
              cover_image = img_cdn.get("landscape_thumb") or img_cdn.get("thumbnail") or item.get("cover_image") or ""
              
              stream_info = item.get("stream_info", {}) if isinstance(item.get("stream_info"), dict) else {}
              dai = stream_info.get("dai_asset_key") or stream_info.get("dai_url")
              servers = {"Original Server": str(dai).strip()} if dai and str(dai).startswith("http") else {}
              
              status = "LIVE" if servers or is_live_event(item) else "UPCOMING"
              return {
                  "match_id": str(item.get("contentId") or item.get("match_id", "")),
                  "title": title,
                  "synopsis": v_info.get("longDescription") or title,
                  "status": status,
                  "time": air_dates.get("originalAirDate") or item.get("time") or "",
                  "cover_image": cover_image,
                  "logo": cover_image,
                  "match_url": servers.get("Original Server", ""),
                  "is_free": False,
                  "stream_url": servers
              }

          def is_bingstream_item(item):
              if not isinstance(item, dict): return False
              return any(k in item for k in ["link_live", "videoURL", "video_url", "localteam_name"])

          def transform_bingstream_item(item):
              title = item.get("name") or item.get("title") or item.get("event_name") or "Sports Match"
              servers = {}
              suffix = "|http-user-agent=Mozilla/5.0&http-referrer=https://iframe.rumsport8.live/"
              if "link_live" in item and isinstance(item["link_live"], list):
                  for idx, obj in enumerate(item["link_live"], 1):
                      u = obj.get("videoURL") or obj.get("video_url") if isinstance(obj, dict) else str(obj)
                      if u and str(u).startswith("http"):
                          servers[f"Server {idx}"] = f"{u.split('|http-')[0]}{suffix}"
              
              return {
                  "match_id": str(item.get("id") or item.get("match_id") or ""),
                  "title": title,
                  "localteam_name": item.get("localteam_name"),
                  "visitorteam_name": item.get("visitorteam_name"),
                  "localteam_logo": item.get("localteam_logo"),
                  "visitorteam_logo": item.get("visitorteam_logo"),
                  "status": "LIVE" if is_live_event(item) else "UPCOMING",
                  "time": item.get("time") or item.get("bd_time") or "",
                  "cover_image": item.get("cover_image") or item.get("thumbnail") or "",
                  "logo": item.get("cover_image") or item.get("thumbnail") or "",
                  "stream_url": servers
              }

          def is_live_event(item):
              if not isinstance(item, dict): return False
              if item.get("is_playing") is True: return True
              for k in ["is_live", "live", "isLive", "status"]:
                  if k in item and "live" in str(item[k]).lower(): return True
              return False

          def extract_items_from_json(data):
              items = []
              def walk(obj):
                  if isinstance(obj, list):
                      for elem in obj: walk(elem)
                  elif isinstance(obj, dict):
                      if any(k in obj for k in ["channels", "link_live", "video_info", "localteam_name", "stream_url", "stream_url_alpha"]):
                          items.append(obj)
                      else:
                          for v in obj.values(): walk(v)
              walk(data)
              return items

          def get_playlist_info(url_line):
              if "|" in url_line:
                  name, url = url_line.split("|", 1)
                  return name.strip(), f"{re.sub(r'[^a-zA-Z0-9_-]', '_', name.lower())}.txt", url.strip()
              url = url_line.strip()
              base = os.path.splitext(os.path.basename(url.split("?")[0]))[0] or "playlist"
              return base.title(), f"{base.lower()}.txt", url

          all_collected_events = []
          for line in lines:
              name, txt_filename, url = get_playlist_info(line)
              current_source_items = []
              try:
                  raw_json = fetch_data(url)
                  for it in extract_items_from_json(raw_json):
                      if is_livesports_item(it): current_source_items.append(transform_livesports_item(it))
                      elif is_sonyliv_item(it): current_source_items.append(transform_sonyliv_item(it))
                      elif is_bingstream_item(it): current_source_items.append(transform_bingstream_item(it))
                      else: current_source_items.append(it)
                  all_collected_events.extend(current_source_items)
                  with open(txt_filename, "w", encoding="utf-8") as f:
                      f.write(f"🚀 {name} Synced | Channels: {len(current_source_items)}\n")
              except Exception as e:
                  print(f"❌ Error fetching {name}: {e}")

          # ================= লোগো এবং VS ব্যানার তৈরি =================
          print("🎨 Generating Dual-Team VS Posters & Accurate Logos...")
          for event in all_collected_events:
              try:
                  detect_teams_and_assign_logo(event)
              except Exception as e:
                  print(f"Banner skip: {e}")

          total_count = len(all_collected_events)
          final_json = {
              "playlist_name": "All Sports & Cricket Event Info",
              "developer": "MD ANAMUL HOQUE",
              "telegram": "https://t.me/ireentv",
              "channels_amount": total_count,
              "live_count": sum(1 for it in all_collected_events if is_live_event(it)),
              "last_update": current_time,
              "events": all_collected_events
          }

          with open("willow.json", "w", encoding="utf-8") as f:
              json.dump(final_json, f, indent=2, ensure_ascii=False)
          print(f"🎯 Finished! Created Posters and saved to willow.json")
          EOF

          python3 update_playlist.py
          rm -f update_playlist.py

      - name: Commit and Push
        run: |
          export TZ="Asia/Kolkata"
          git add willow.json *.txt logos/
          if ! git diff --cached --quiet; then
            git commit -m "Auto VS Posters & Logos Synced ✅ [$(date +'%d-%m-%Y %H:%M')]"
            git push origin main
          else
            echo "No changes to commit"
          fi
