name: Automated Sports Data JSON & All TXT Updater

on:
  schedule:
    - cron: '*/15 * * * *'   # প্রতি ১৫ মিনিট পরপর চলবে
  workflow_dispatch:
  repository_dispatch:
    types: [update-playlist]

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "ireentv"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz urllib3

      - name: Fetch, Filter Credits, Count Live and Generate All Files
        env:
          JSON_PLAYLIST_URLS: ${{ secrets.JSON_PLAYLIST_URLS }}
        run: |
          git pull origin main --rebase
          python3 - << 'EOF'
          import os
          import re
          import json
          import requests
          import urllib3
          from datetime import datetime
          import pytz

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          tz = pytz.timezone("Asia/Kolkata")
          current_time = datetime.now(tz).strftime("%I:%M %p %d-%m-%Y")

          raw_urls = os.environ.get("JSON_PLAYLIST_URLS", "")
          lines = [u.strip() for u in raw_urls.splitlines() if u.strip() and not u.strip().startswith("#")]

          SONY_M3U_URL = "https://raw.githubusercontent.com/doctor-8trange/zyphora/refs/heads/main/data/sony.m3u"

          def parse_m3u(m3u_text):
              """M3U প্লেলিস্ট পার্স করে চ্যানেল ও স্ট্রিম লিঙ্ক বের করা"""
              playlist = []
              lines = [l.strip() for l in m3u_text.splitlines() if l.strip()]
              current_name = None
              for line in lines:
                  if line.startswith("#EXTINF"):
                      parts = line.split(",", 1)
                      current_name = parts[1].strip() if len(parts) > 1 else "Stream"
                  elif not line.startswith("#") and line.startswith("http"):
                      playlist.append({
                          "name": current_name or "Stream",
                          "url": line.strip()
                      })
                      current_name = None
              return playlist

          def fetch_external_sony_m3u():
              """বাহ্যিক Sony M3U প্লেলিস্ট লোড করা"""
              try:
                  print("Fetching external Sony M3U streams...")
                  headers = {"User-Agent": "Mozilla/5.0"}
                  res = requests.get(SONY_M3U_URL, headers=headers, timeout=20, verify=False)
                  if res.status_code == 200:
                      items = parse_m3u(res.text)
                      print(f"Successfully loaded {len(items)} channels from sony.m3u")
                      return items
              except Exception as e:
                  print(f"Error fetching sony.m3u: {e}")
              return []

          def fetch_data(url):
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*"
              }
              res = requests.get(url, headers=headers, timeout=30, verify=False)
              res.raise_for_status()
              clean_text = res.content.decode('utf-8-sig', errors='ignore').strip()
              return json.loads(clean_text)

          def is_sonyliv_item(item):
              if not isinstance(item, dict):
                  return False
              if "multiple_audio_links" in item:
                  return True
              if "video_info" in item and ("stream_info" in item or "image_cdn" in item):
                  return True
              if "contentId" in item and ("video_info" in item or "air_dates" in item):
                  return True
              return False

          def find_matching_m3u_streams(item, m3u_streams):
              """M3U থেকে অডিও ভাষা ও চ্যানেলের নামের সাথে মিল রেখে লিঙ্ক খোঁজা"""
              matched = {}
              v_info = item.get("video_info", {}) if isinstance(item.get("video_info"), dict) else {}
              title = (v_info.get("title") or item.get("title") or "").lower()

              audio_langs = []
              audio_links = item.get("multiple_audio_links", [])
              if isinstance(audio_links, list):
                  for audio in audio_links:
                      if isinstance(audio, dict):
                          lang = (audio.get("language") or audio.get("lang_code") or "").strip()
                          if lang and lang.lower() not in [l.lower() for l in audio_langs]:
                              audio_langs.append(lang)

              # ১. অডিও ল্যাঙ্গুয়েজ অনুযায়ী M3U তে খোঁজা
              for lang in audio_langs:
                  lang_lower = lang.lower()
                  for m in m3u_streams:
                      m_name = m["name"].lower()
                      if lang_lower in m_name:
                          matched[f"Server ({lang})"] = m["url"]
                          break

              # ২. চ্যানেল নাম অনুযায়ী M3U তে খোঁজা (যেমন: Ten 1, Ten 2, Six ইত্যাদি)
              for ch in ["ten 1", "ten 2", "ten 3", "ten 4", "ten 5", "six", "yay", "max", "sab"]:
                  if ch in title:
                      for m in m3u_streams:
                          m_name = m["name"].lower()
                          if ch in m_name:
                              label = f"Server ({m['name']})"
                              if label not in matched:
                                  matched[label] = m["url"]

              # ৩. টাইটেলের কি-ওয়ার্ড দিয়ে ম্যাচ করা
              if not matched:
                  words = [w for w in re.findall(r'[a-zA-Z0-9]+', title) if len(w) > 3 and w not in ["live", "match", "sony", "sports", "vs"]]
                  for m in m3u_streams:
                      m_name = m["name"].lower()
                      if any(w in m_name for w in words):
                          matched[f"Server ({m['name']})"] = m["url"]

              return matched

          def extract_sonyliv_streams(item, m3u_streams):
              servers = {}
              server_idx = 1

              # ১. শুধুমাত্র DAI লিঙ্কটি JSON সোর্স থেকে আসবে
              stream_info = item.get("stream_info", {}) if isinstance(item.get("stream_info"), dict) else {}
              dai = stream_info.get("dai_asset_key") or item.get("dai_asset_key")
              if dai and str(dai).startswith("http"):
                  servers[f"Server {server_idx} (DAI)"] = str(dai).strip()
                  server_idx += 1

              # ২. বাকি সব স্ট্রিম লিঙ্ক আসবে M3U প্লেলিস্ট থেকে
              m3u_matches = find_matching_m3u_streams(item, m3u_streams)
              for label, stream_url in m3u_matches.items():
                  clean_label = f"Server {server_idx} {label.replace('Server', '').strip()}"
                  servers[clean_label] = stream_url.strip()
                  server_idx += 1

              return servers

          def transform_sonyliv_item(item, m3u_streams):
              v_info = item.get("video_info", {}) if isinstance(item.get("video_info"), dict) else {}
              img_cdn = item.get("image_cdn", {}) if isinstance(item.get("image_cdn"), dict) else {}
              air_dates = item.get("air_dates", {}) if isinstance(item.get("air_dates"), dict) else {}
              stream_info = item.get("stream_info", {}) if isinstance(item.get("stream_info"), dict) else {}

              title = v_info.get("episodeTitle") or v_info.get("title") or item.get("title") or "Live Match"
              synopsis = v_info.get("longDescription") or v_info.get("shortDescription") or item.get("synopsis") or title

              cover_image = (
                  img_cdn.get("landscape_thumb") or 
                  img_cdn.get("thumbnail") or 
                  img_cdn.get("portrait_thumb") or 
                  item.get("cover_image") or ""
              )

              match_url = stream_info.get("dai_asset_key") or item.get("match_url")
              if not match_url or not str(match_url).startswith("http"):
                  match_url = f"https://www.sonyliv.com/custom-live/{item.get('contentId', '')}"

              stream_urls = extract_sonyliv_streams(item, m3u_streams)

              return {
                  "match_id": str(item.get("contentId") or item.get("match_id", "")),
                  "title": title,
                  "synopsis": synopsis,
                  "status": "LIVE",
                  "time": air_dates.get("originalAirDate") or item.get("time", ""),
                  "cover_image": cover_image,
                  "match_url": match_url,
                  "is_free": False,
                  "stream_url_alpha": stream_urls
              }

          def extract_items_from_json(data):
              items = []
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  for key in ["events", "matches", "data", "channels", "items", "streams", "result", "list"]:
                      if key in data and isinstance(data[key], list):
                          items.extend(data[key])
                  
                  if not items:
                      for k, v in data.items():
                          if k.lower() in ["owner", "telegram", "credit", "website", "admin", "notice"]:
                              continue
                          if isinstance(v, list) and len(v) > 0 and isinstance(v[0], dict):
                              items.extend(v)
                          elif isinstance(v, dict) and ("title" in v or "contentId" in v or "stream_url_alpha" in v):
                              items.append(v)

                  if not items and ("contentId" in data or "match_id" in data or "video_info" in data):
                      items.append(data)
              return items

          def is_live_event(item):
              if not isinstance(item, dict):
                  return False
              for k in ["is_live", "live", "isLive", "islive"]:
                  if k in item:
                      val = item[k]
                      if val in [True, 1, "true", "1", "live", "yes", "True"]:
                          return True
              for k in ["status", "event_status", "match_status", "badge", "state"]:
                  if k in item and isinstance(item[k], str) and "live" in item[k].lower():
                      return True
              return False

          def get_playlist_info(url_line):
              if "|" in url_line:
                  name, url = url_line.split("|", 1)
                  name = name.strip()
                  filename = re.sub(r'[^a-zA-Z0-9_-]', '_', name.lower()) + ".txt"
                  return name, filename, url.strip()
              
              url = url_line.strip()
              url_lower = url.lower()
              if "willow" in url_lower or "live_sports" in url_lower:
                  return "Willow", "willow.txt", url
              elif "prime" in url_lower:
                  return "PrimeVideo", "primevideo.txt", url
              elif "sony" in url_lower:
                  return "Sony LIV", "sonyliv.txt", url
              elif "sports_data" in url_lower:
                  return "Sports Data", "sports_data.txt", url
              else:
                  base = os.path.splitext(os.path.basename(url.split("?")[0]))[0]
                  clean_name = re.sub(r'[^a-zA-Z0-9_-]', '_', base) if base else "playlist"
                  return clean_name.replace("_", " ").title(), f"{clean_name.lower()}.txt", url

          all_collected_events = []
          sony_m3u_streams = fetch_external_sony_m3u()

          print(f"Total Playlist URLs Found in Secrets: {len(lines)}")

          for idx, line in enumerate(lines, 1):
              name, txt_filename, url = get_playlist_info(line)
              current_source_items = []
              
              try:
                  print(f"[{idx}/{len(lines)}] Fetching: {name} from {url[:45]}...")
                  raw_json = fetch_data(url)
                  raw_items = extract_items_from_json(raw_json)

                  for it in raw_items:
                      if not isinstance(it, dict):
                          continue
                      if is_sonyliv_item(it):
                          current_source_items.append(transform_sonyliv_item(it, sony_m3u_streams))
                      else:
                          current_source_items.append(it)

                  all_collected_events.extend(current_source_items)

                  src_total = len(current_source_items)
                  src_live = sum(1 for it in current_source_items if is_live_event(it))

                  log_line = f"🚀 {name} Synced | IST: {current_time} | Channels: {src_total} | Live: {src_live}\n"
                  with open(txt_filename, "w", encoding="utf-8") as f:
                      f.write(log_line)

                  print(f"✅ Success: {name} -> Extracted: {src_total} items (Live: {src_live})")

              except Exception as e:
                  print(f"❌ Error fetching {name} ({url}): {e}")

          total_count = len(all_collected_events)
          live_count = sum(1 for item in all_collected_events if is_live_event(item))

          final_json = {
              "playlist_name": "All Sports & Cricket Event Info",
              "owner": "MD ANAMUL HOQUE",
              "telegram": "https://t.me/ireentv",
              "website": "https://anamul.pages.dev",
              "developer": "IreenTechnology",
              "version": "1.0",
              "channels_amount": total_count,
              "live_count": live_count,
              "last_update": current_time,
              "events": all_collected_events
          }

          with open("willow.json", "w", encoding="utf-8") as f:
              json.dump(final_json, f, indent=2, ensure_ascii=False)

          print(f"🎯 Finished! Total Combined Channels: {total_count}")
          EOF

      - name: Commit and Push
        run: |
          export TZ="Asia/Kolkata"
          git add willow.json *.txt
          if ! git diff --cached --quiet; then
            git commit -m "All Playlists Synced Successfully ✅ [$(date +'%d-%m-%Y %H:%M')]"
            git push origin main
          else
            echo "No changes to commit"
          fi
