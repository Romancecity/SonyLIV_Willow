steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Configure Git User
    run: |
      git config --global user.name "ireentv"
      git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

  - name: Fetch, Filter Old Credits, and Apply New Details
    run: |
      git pull origin main --rebase
      
      python3 - << 'EOF'
      import urllib.request
      import json
      from datetime import datetime
      import pytz

      # সময় নির্ধারণ (Asia/Kolkata)
      tz = pytz.timezone('Asia/Kolkata')
      current_time = datetime.now(tz).strftime('%I:%M %p %d-%m-%Y')

      headers = {'User-Agent': 'Mozilla/5.0'}

      def fetch_url(url):
          req = urllib.request.Request(url, headers=headers)
          return urllib.request.urlopen(req).read().decode('utf-8')

      # ফিল্টার করার জন্য কি-ওয়ার্ড তালিকা
      bad_keywords = ["hady", "sohanur", "livesportsplay", "monirul", "#playlist:", "#last_update:", "#telegram:", "#owner:", "#live_count:"]

      # -------------------------------------------------------------
      # ১. M3U প্লেলিস্ট ফিল্টারিং ও কম্বাইন করা
      # -------------------------------------------------------------
      m3u_urls = [
          "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.m3u",
          "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/primevideo_sports.m3u",
          "https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/refs/heads/main/Sports_data.m3u"
      ]

      cleaned_m3u_lines = []
      source_counts = []

      for url in m3u_urls:
          try:
              content = fetch_url(url)
              source_channel_count = 0
              for line in content.splitlines():
                  l = line.strip()
                  # পুরনো ওনার সংক্রান্ত ট্যাগ বাদ দেওয়া
                  if any(bad.lower() in l.lower() for bad in bad_keywords):
                      continue
                  if l.startswith("#EXTM3U") or l.startswith("# Playlist Name:") or l.startswith("# Owner:"):
                      continue
                  if l != "":
                      cleaned_m3u_lines.append(line)
                      if l.startswith("#EXTINF"):
                          source_channel_count += 1
              source_counts.append(source_channel_count)
          except Exception as e:
              print(f"Error fetching {url}: {e}")
              source_counts.append(0)

      # মোট চ্যানেল সংখ্যা গণনা
      total_channel_count = sum(1 for line in cleaned_m3u_lines if line.strip().startswith("#EXTINF"))

      # নতুন M3U প্লেলিস্ট তৈরি
      new_m3u = [
          "#EXTM3U",
          "# Playlist Name: Willow & Prime Cricket Event Info",
          "# Owner: MD ANAMUL HOQUE",
          "# Telegram: https://t.me/ireentv",
          "# Website: https://anamul.pages.dev",
          "# Developer: IreenTechnology",
          "# Version: 1.0",
          f"# Channels Amount: {total_channel_count}",
          f"# Last Update: {current_time}",
          ""
      ]
      new_m3u.extend(cleaned_m3u_lines)

      with open("willow.m3u", "w", encoding="utf-8") as f:
          f.write("\n".join(new_m3u).strip() + "\n")

      # -------------------------------------------------------------
      # ২. JSON প্লেলিস্ট ফিল্টারিং ও কম্বাইন করা
      # -------------------------------------------------------------
      json_urls = [
          "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/live_sports.json",
          "https://raw.githubusercontent.com/srhady/willow-event/refs/heads/main/primevideo_sports.json",
          "https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/refs/heads/main/Sports_data.json"
      ]

      def contains_old_credit(obj):
          s = json.dumps(obj).lower()
          return any(bad.lower() in s for bad in ["hady", "sohanur", "livesportsplay", "monirul"])

      blocked_keys = {
          "owner", "telegram", "website", "developer", "version", 
          "playlist_name", "playlist", "last_update", "live_count", 
          "admin", "channel_count", "channels_amount"
      }

      combined_events = []
      combined_dict = {}

      for url in json_urls:
          try:
              raw = fetch_url(url)
              data = json.loads(raw)

              if isinstance(data, dict):
                  for k, v in data.items():
                      if k.lower() in blocked_keys or contains_old_credit(k) or contains_old_credit(v):
                          continue
                      if isinstance(v, list):
                          cleaned_list = [item for item in v if not contains_old_credit(item)]
                          if k in combined_dict:
                              combined_dict[k].extend(cleaned_list)
                          else:
                              combined_dict[k] = cleaned_list
                      else:
                          combined_dict[k] = v

              elif isinstance(data, list):
                  cleaned_list = [item for item in data if not contains_old_credit(item)]
                  combined_events.extend(cleaned_list)
          except Exception as e:
              print(f"Error fetching JSON {url}: {e}")

      meta = {
          "playlist_name": "Willow & Prime Cricket Event Info",
          "owner": "MD ANAMUL HOQUE",
          "telegram": "https://t.me/ireentv",
          "website": "https://anamul.pages.dev",
          "developer": "IreenTechnology",
          "version": "1.0",
          "channels_amount": total_channel_count,
          "last_update": current_time
      }

      final_json = {**meta}
      if combined_dict:
          final_json.update(combined_dict)
      if combined_events:
          if "events" in final_json:
              final_json["events"].extend(combined_events)
          else:
              final_json["events"] = combined_events

      # willow.json ফাইলে সেভ করা
      with open("willow.json", "w", encoding="utf-8") as f:
          json.dump(final_json, f, indent=2, ensure_ascii=False)

      # -------------------------------------------------------------
      # ৩. আলাদা আলাদা টেক্সট লগ ফাইল আপডেট করা
      # -------------------------------------------------------------
      # ১ম প্লেলিস্টের জন্য willow.txt
      with open("willow.txt", "a", encoding="utf-8") as f:
          f.write(f"🚀 Willow Synced | IST: {current_time} | Channels: {source_counts[0]}\n")

      # ২য় প্লেলিস্টের জন্য primevideo.txt
      with open("primevideo.txt", "a", encoding="utf-8") as f:
          f.write(f"🚀 PrimeVideo Synced | IST: {current_time} | Channels: {source_counts[1]}\n")

      # ৩য় প্লেলিস্টের জন্য sports_data.txt
      with open("sports_data.txt", "a", encoding="utf-8") as f:
          f.write(f"🚀 Sports Data Synced | IST: {current_time} | Channels: {source_counts[2]}\n")

      EOF

  - name: Commit and Push
    run: |
      export TZ="Asia/Kolkata"
      git add willow.json willow.m3u willow.txt primevideo.txt sports_data.txt
      if ! git diff --cached --quiet; then
        git commit -m "Willow, PrimeVideo & Sports Data Database Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
        git push origin main
      else
        echo "No changes to commit"
      fi
