name: Automated Sports Data JSON & All TXT Updater

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "ireentv"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytz

      - name: Fetch, Filter Credits, Count Live and Generate All Files
        env:
          JSON_PLAYLIST_URLS: ${{ secrets.JSON_PLAYLIST_URLS }}
        run: |
          git pull origin main --rebase

          cat << 'EOF' > update_playlist.py
          import os
          import re
          import urllib.request
          import json
          from datetime import datetime
          import pytz

          # সময় নির্ধারণ (Asia/Kolkata)
          tz = pytz.timezone("Asia/Kolkata")
          current_time = datetime.now(tz).strftime("%I:%M %p %d-%m-%Y")

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          # GitHub Secrets থেকে লিংক নেওয়া
          raw_urls = os.environ.get("JSON_PLAYLIST_URLS", "")
          lines = [u.strip() for u in raw_urls.splitlines() if u.strip() and not u.strip().startswith("#")]

          def fetch_url(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode("utf-8")

          # বাদ দেওয়ার মতো শব্দ ও ক্রেডিট তালিকা
          bad_keywords = [
              "hady", "sohanur", "livesportsplay", "monirul", 
              "telegram", "t.me", "owner", "admin", "developer",
              "facebook", "whatsapp", "credit", "author", "website", "contact"
          ]

          blocked_keys = {
              "owner", "telegram", "website", "developer", "version", 
              "playlist_name", "playlist", "last_update", "live_count", 
              "admin", "channel_count", "channels_amount", "credits",
              "notice", "contact", "author", "message"
          }

          def contains_bad_info(val):
              s = json.dumps(val, ensure_ascii=False).lower()
              return any(bad in s for bad in bad_keywords)

          def is_sonyliv_item(item):
              """সোনি লিভ ডেটা কিনা তা শনাক্ত করার লজিক"""
              if not isinstance(item, dict):
                  return False
              return ("multiple_audio_links" in item) or ("video_info" in item and "stream_info" in item)

          def transform_sonyliv_item(item):
              """সোনি লিভ ডেটাকে আপনার কাস্টম ফরম্যাটে রূপান্তর করার ফাংশন"""
              if not isinstance(item, dict):
                  return item

              v_info = item.get("video_info", {})
              img_cdn = item.get("image_cdn", {})
              air_dates = item.get("air_dates", {})
              stream_info = item.get("stream_info", {})
              
              # Title ও Synopsis নির্ধারণ
              title = v_info.get("episodeTitle") or v_info.get("title", "")
              synopsis = v_info.get("longDescription") or v_info.get("shortDescription") or title
              
              # Cover Image নির্ধারণ
              cover_image = (
                  img_cdn.get("landscape_thumb") or 
                  img_cdn.get("thumbnail") or 
                  img_cdn.get("portrait_thumb") or ""
              )
              
              # Match URL নির্ধারণ
              match_url = stream_info.get("dai_asset_key") or f"https://www.sonyliv.com/custom-live/{item.get('contentId', '')}"
              
              # মাল্টি-অডিও থেকে সার্ভার লিস্ট তৈরি
              stream_url_alpha = {}
              audio_links = item.get("multiple_audio_links", [])
              server_count = 1

              if isinstance(audio_links, list) and len(audio_links) > 0:
                  for audio in audio_links:
                      lang = audio.get("language", "")
                      data_obj = audio.get("data", {})
                      playback_url = data_obj.get("Playback_videoURL")
                      
                      if playback_url:
                          server_name = f"Server {server_count} ({lang})" if lang else f"Server {server_count}"
                          stream_url_alpha[server_name] = playback_url
                          server_count += 1
              
              # কোনো কারণে অডিও লিঙ্ক না থাকলে ডিফল্ট dai_asset_key নেওয়া
              if not stream_url_alpha:
                  dai_key = stream_info.get("dai_asset_key")
                  if dai_key and dai_key != "unavailable":
                      stream_url_alpha["Server 1"] = dai_key

              return {
                  "match_id": str(item.get("contentId", "")),
                  "title": title,
                  "synopsis": synopsis,
                  "status": "LIVE",
                  "time": air_dates.get("originalAirDate", ""),
                  "cover_image": cover_image,
                  "match_url": match_url,
                  "is_free": False,
                  "stream_url_alpha": stream_url_alpha
              }

          def process_items(item_list):
              """আইটেম প্রসেসিং এবং সোনি লিভ হলে কনভার্ট করা"""
              processed = []
              for it in item_list:
                  if contains_bad_info(it):
                      continue
                  if is_sonyliv_item(it):
                      processed.append(transform_sonyliv_item(it))
                  else:
                      processed.append(it)
              return processed

          def is_live_event(item):
              """লাইভ চ্যানেল শনাক্ত করার লজিক"""
              if not isinstance(item, dict):
                  return False
              for k in ["is_live", "live", "isLive", "islive"]:
                  if k in item:
                      val = item[k]
                      if isinstance(val, bool) and val is True:
                          return True
                      if isinstance(val, (int, float)) and val == 1:
                          return True
                      if isinstance(val, str) and val.strip().lower() in ["true", "1", "live", "yes"]:
                          return True
              for k in ["status", "event_status", "match_status", "badge", "state"]:
                  if k in item:
                      val = item[k]
                      if isinstance(val, str) and "live" in val.strip().lower():
                          return True
              return False

          def get_playlist_name_and_filename(url_line):
              """ইউআরএল থেকে ফাইলের নাম ও ডিসপ্লে নাম তৈরি"""
              if "|" in url_line:
                  name, url = url_line.split("|", 1)
                  name = name.strip()
                  filename = re.sub(r'[^a-zA-Z0-9_-]', '_', name.lower()) + ".txt"
                  return name, filename, url.strip()
              
              url = url_line.strip()
              url_lower = url.lower()
              if "willow" in url_lower or "live_sports" in url_lower:
                  return "Willow", "willow.txt", url
              elif "primevideo" in url_lower:
                  return "PrimeVideo", "primevideo.txt", url
              elif "sports_data" in url_lower:
                  return "Sports Data", "sports_data.txt", url
              elif "sony" in url_lower:
                  return "Sony LIV", "sonyliv.txt", url
              else:
                  base = os.path.splitext(os.path.basename(url.split("?")[0]))[0]
                  clean_name = re.sub(r'[^a-zA-Z0-9_-]', '_', base) if base else "playlist"
                  return clean_name.replace("_", " ").title(), f"{clean_name.lower()}.txt", url

          combined_events = []
          combined_dict = {}

          for line in lines:
              name, txt_filename, url = get_playlist_name_and_filename(line)
              source_items = []
              
              try:
                  raw_data = fetch_url(url)
                  data = json.loads(raw_data)

                  if isinstance(data, dict):
                      for k, v in data.items():
                          if k.lower() in blocked_keys or contains_bad_info(k):
                              continue
                          if isinstance(v, list):
                              cleaned_items = process_items(v)
                              source_items.extend(cleaned_items)
                              if k in combined_dict:
                                  combined_dict[k].extend(cleaned_items)
                              else:
                                  combined_dict[k] = cleaned_items
                          elif isinstance(v, dict):
                              if not contains_bad_info(v):
                                  if is_sonyliv_item(v):
                                      transformed = transform_sonyliv_item(v)
                                      combined_dict[k] = transformed
                                      source_items.append(transformed)
                                  else:
                                      combined_dict[k] = v
                          else:
                              if not contains_bad_info(v):
                                  combined_dict[k] = v

                  elif isinstance(data, list):
                      cleaned_items = process_items(data)
                      source_items.extend(cleaned_items)
                      combined_events.extend(cleaned_items)

                  # কাউন্ট
                  src_total = len(source_items)
                  src_live = sum(1 for it in source_items if is_live_event(it))

                  # .txt লগ তৈরি
                  log_line = f"🚀 {name} Synced | IST: {current_time} | Channels: {src_total} | Live: {src_live}\n"
                  with open(txt_filename, "w", encoding="utf-8") as f:
                      f.write(log_line)

                  print(f"Created: {txt_filename} -> Channels: {src_total}, Live: {src_live}")

              except Exception as e:
                  print(f"Error fetching {name} ({url}): {e}")

          # সামগ্রিক মেটাডাটা ও কাউন্ট
          all_items = list(combined_events)
          for v in combined_dict.values():
              if isinstance(v, list):
                  all_items.extend(v)

          total_count = len(all_items)
          live_count = sum(1 for item in all_items if is_live_event(item))

          meta = {
              "playlist_name": "Willow & Prime Cricket Event Info",
              "owner": "MD ANAMUL HOQUE",
              "telegram": "https://t.me/ireentv",
              "website": "https://anamul.pages.dev",
              "developer": "IreenTechnology",
              "version": "1.0",
              "channels_amount": total_count,
              "live_count": live_count,
              "last_update": current_time
          }

          final_json = {**meta}
          if combined_dict:
              final_json.update(combined_dict)
          if combined_events:
              if "events" in final_json:
                  final_json["events"].extend(combined_events)
              else:
                  final_json["events"] = combined_events

          with open("willow.json", "w", encoding="utf-8") as f:
              json.dump(final_json, f, indent=2, ensure_ascii=False)

          EOF

          python3 update_playlist.py
          rm -f update_playlist.py

      - name: Commit and Push
        run: |
          export TZ="Asia/Kolkata"
          git add willow.json *.txt
          if ! git diff --cached --quiet; then
            git commit -m "Willow & All Playlists Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
            git push origin main
          else
            echo "No changes to commit"
          fi
